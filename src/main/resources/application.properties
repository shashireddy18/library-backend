server.port=${PORT:9090}

# ---- MySQL (works locally and on Railway) ----
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:library_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- App settings ----
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-string-at-least-32-chars}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
app.admin.username=${ADMIN_USERNAME:librarian}
app.admin.password=${ADMIN_PASSWORD:admin123}
library.fine-per-day=${FINE_PER_DAY:2.0}
library.loan-days=${LOAN_DAYS:14}
